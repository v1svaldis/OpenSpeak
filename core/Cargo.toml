[package]
name = "openspeak-core"
version = "0.3.0"
edition = "2021"
description = "Native core of Open Speak: TeamSpeak protocol, audio and stream signaling"
license = "MIT OR Apache-2.0"

[lib]
name = "openspeak_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tsclientlib = { path = "vendor/tsclientlib/tsclientlib", default-features = false, features = ["audio"] }
tsproto-packets = { path = "vendor/tsclientlib/utils/tsproto-packets" }
tsproto-types = { path = "vendor/tsclientlib/utils/tsproto-types" }
audiopus = "0.3.0-rc.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", features = ["log"] }
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", features = ["audio", "api-level-28"] }
android_logger = "0.14"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
